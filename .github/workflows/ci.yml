name: CI

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Linux system dependencies for Tauri 2
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run all tests
        run: npm run test:all

  rust-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The Linux job cannot compile or exercise AppKit / NSPanel paths.
      - name: Compile and run Rust tests on macOS
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build native tray lifecycle test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features native-tray-tests --test macos_tray_lifecycle --no-run

      # Requires a desktop session. Keep this separate from ordinary tests
      # so headless local runs do not create UI windows.
      - name: Verify native tray window lifecycle
        timeout-minutes: 2
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features native-tray-tests --test macos_tray_lifecycle
