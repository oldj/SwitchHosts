[package]
name = "switchhosts"
version = "5.0.3-beta.2"
description = "A GUI tool for managing your hosts file."
authors = ["oldj"]
edition = "2021"
rust-version = "1.90"
# Disambiguate the main app binary from the `swh_helper` bin target so
# the Tauri bundler / `cargo run` pick the app, not the helper (which
# would otherwise win alphabetically). See src/bin/swh_helper.rs.
default-run = "switchhosts"

[lib]
name = "switchhosts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Opt-in: requires a logged-in macOS desktop and creates native test windows.
native-tray-tests = []

[[test]]
name = "macos_tray_lifecycle"
harness = false
required-features = ["native-tray-tests"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
serde_json = "1.0.151"

[dependencies]
# Tauri 2.12 uses tray-icon 0.25, which restores left-click forwarding on
# macOS 27 when a tray menu is attached (tauri-apps/tray-icon#365).
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-log = "2.10.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
thiserror = "2.0.21"
log = "0.4.34"
# Share reqwest 0.13 with tauri-plugin-updater so SOCKS support is enabled
# for both subscriptions and update downloads through feature unification.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "socks"] }
# Inspect typed TLS errors from reqwest without changing its TLS configuration.
rustls = { version = "0.23.45", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.53.2", features = ["process", "time", "rt", "macros", "net"] }
regex = "1.13.1"
open = "5.4.4"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "objc2-core-foundation"] }
block2 = "0.6.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "6e595d776e9ac594b73e5a180155800f4da6c87d" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
